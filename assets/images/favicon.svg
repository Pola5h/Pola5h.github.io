<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      .bg { fill: #0d0f12; }
      .border { stroke: #2a2e37; stroke-width: 1.5; }
      .txt {
        fill: #f4f5f7;
        font-family: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", "Liberation Mono", Menlo, monospace;
        font-size: 14.5px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      @media (prefers-color-scheme: light) {
        .bg { fill: #0f1115; }
        .border { stroke: #1e222a; }
        .txt { fill: #ffffff; }
      }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #111317; }
        .border { stroke: #333842; }
        .txt { fill: #f8fafc; }
      }
    </style>
  </defs>
  <rect class="bg border" x="1" y="1" width="30" height="30" rx="7" />
  <text class="txt" x="16" y="21.5" text-anchor="middle">KP</text>
</svg>
